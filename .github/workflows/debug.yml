name: Debug XamlCompiler

on:
  workflow_dispatch:

jobs:
  variants:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [vP1-u3plusRes, vP2-p1plusBoxRes]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build variant
        shell: bash
        run: |
          V="${{ matrix.variant }}"
          dotnet publish "debug/$V/FluentSakhrDictionary.csproj" -c Release -r win-x64 -p:Platform=x64 --self-contained false -p:DebugType=none -o "out-$V" 2>&1 | tail -4
