name: Build

on:
  push:
    branches: [main]
    paths: ['src/**', 'installer/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (WinUI 3, win-x64, framework-dependent)
        shell: bash
        run: |
          if ! dotnet publish src/FluentSakhrDictionary/FluentSakhrDictionary.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained false \
            -p:DebugType=none -p:PublishReadyToRun=true -o publish; then
            echo "=== XamlCompiler output.json ==="
            cat src/FluentSakhrDictionary/obj/x64/Release/net8.0-windows10.0.19041.0/win-x64/output.json 2>/dev/null || echo "no output.json"
            echo "=== direct XamlCompiler run ==="
            XC="$USERPROFILE/.nuget/packages/microsoft.windowsappsdk/1.6.250108002/tools/net472/XamlCompiler.exe"
            ls -la "$XC" || echo "XamlCompiler.exe missing"
            IN=$(pwd)/src/FluentSakhrDictionary/obj/x64/Release/net8.0-windows10.0.19041.0/win-x64/input.json
            OUT=$(pwd)/src/FluentSakhrDictionary/obj/x64/Release/net8.0-windows10.0.19041.0/win-x64/output.json
            "$XC" "$IN" "$OUT"; echo "direct exit=$?"
            cat "$OUT" 2>/dev/null || echo "still no output.json"
            exit 1
          fi

      - name: Verify output structure
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200
          $need = @('SakhrDictionaryRevive.exe','SakhrDictionaryRevive.dll','SakhrDictionaryRevive.runtimeconfig.json','app.ico','Microsoft.WinUI.dll','data/dictionary.jsonl')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path publish $_)) }
          if ($missing) { Write-Error "Missing: $missing"; exit 1 }
          if (-not (Get-ChildItem publish -Filter *.pri)) { Write-Error "No .pri resource file"; exit 1 }
          Write-Host "Structure OK"

      - name: Smoke test (install Windows App Runtime, launch for 10s)
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-x64.exe -OutFile wari.exe
          Start-Process .\wari.exe -ArgumentList '--quiet' -Wait
          $p = Start-Process publish\SakhrDictionaryRevive.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "App exited early with code $($p.ExitCode)"; if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; exit 1 }
          Write-Host "App still running after 10s"
          Stop-Process -Id $p.Id -Force

      - name: Capture app screenshots (CAT light + dark, Arabic قط, inflections)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:APPDATA\SakhrDictionaryRevive" | Out-Null
          # About page: the app icon must render (crisp 256px PNG).
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-about.png",'--shot-page','about' -PassThru
          $ok = $p.WaitForExit(120000)
          if (-not $ok) { Stop-Process -Id $p.Id -Force; Write-Error "About page capture hung"; exit 1 }
          if (-not (Test-Path app-about.png)) { Write-Error "About screenshot missing"; exit 1 }
          '{"UseWiktionary":true}' | Set-Content "$env:APPDATA\SakhrDictionaryRevive\settings.json"
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-home.png" -PassThru -Wait
          if (-not (Test-Path app-home.png)) { Write-Error "Home screenshot missing"; exit 1 }
          '{"UseWiktionary":true,"Language":"ar"}' | Set-Content "$env:APPDATA\SakhrDictionaryRevive\settings.json"
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-arabic-ui.png" -PassThru -Wait
          if (-not (Test-Path app-arabic-ui.png)) { Write-Error "Arabic UI screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-arabic-ui-cat.png",'--shot-word','CAT' -PassThru -Wait
          if (-not (Test-Path app-arabic-ui-cat.png)) { Write-Error "Arabic UI CAT screenshot missing"; exit 1 }
          # Repro: his v0.4.0 Settings hang - his exact settings file (Dark, custom accent, Wiktionary off,
          # no Language key like a v0.3.0 file), navigated through the real nav-view DrillIn transition.
          '{"Theme":"Default","Backdrop":"Acrylic","Accent":"#8764B8","UseWiktionary":false,"Language":"system"}' | Set-Content "$env:APPDATA\SakhrDictionaryRevive\settings.json"
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-settings-his.png",'--shot-page','settings-nav','--shot-size','960x560' -PassThru
          $ok = $p.WaitForExit(120000)
          if (-not $ok) { Stop-Process -Id $p.Id -Force; if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "REPRODUCED: settings page HUNG with his settings (killed after 120s)"; exit 1 }
          if (-not (Test-Path app-settings-his.png)) { if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "His-settings screenshot missing"; exit 1 }
          # Probe 2: the ARABIC settings page (state right after clicking العربية) - never CI-tested.
          '{"Theme":"Default","Backdrop":"Acrylic","Accent":"#8764B8","UseWiktionary":false,"Language":"ar"}' | Set-Content "$env:APPDATA\SakhrDictionaryRevive\settings.json"
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-settings-ar.png",'--shot-page','settings-nav','--shot-size','960x560' -PassThru
          $ok = $p.WaitForExit(120000)
          if (-not $ok) { Stop-Process -Id $p.Id -Force; if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "REPRODUCED: ARABIC settings page HUNG (killed after 120s)"; exit 1 }
          if (-not (Test-Path app-settings-ar.png)) { Write-Error "Arabic settings screenshot missing"; exit 1 }
          # About page: the app icon must render (crisp 256px PNG).
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-about.png",'--shot-page','about' -PassThru
          $ok = $p.WaitForExit(120000)
          if (-not $ok) { Stop-Process -Id $p.Id -Force; Write-Error "About page capture hung"; exit 1 }
          if (-not (Test-Path app-about.png)) { Write-Error "About screenshot missing"; exit 1 }
          '{"UseWiktionary":true}' | Set-Content "$env:APPDATA\SakhrDictionaryRevive\settings.json"
          # About page: the app icon must render (crisp 256px PNG).
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-about.png",'--shot-page','about' -PassThru
          $ok = $p.WaitForExit(120000)
          if (-not $ok) { Stop-Process -Id $p.Id -Force; Write-Error "About page capture hung"; exit 1 }
          if (-not (Test-Path app-about.png)) { Write-Error "About screenshot missing"; exit 1 }
          '{"UseWiktionary":true}' | Set-Content "$env:APPDATA\SakhrDictionaryRevive\settings.json"
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-light.png",'--shot-word','CAT' -PassThru -Wait
          if (-not (Test-Path app-light.png)) { if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "Light screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-dark.png",'--shot-word','CAT','--theme','Dark' -PassThru -Wait
          if (-not (Test-Path app-dark.png)) { if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "Dark screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-arabic.png",'--shot-word','قط' -PassThru -Wait
          if (-not (Test-Path app-arabic.png)) { if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "Arabic screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-settings.png",'--shot-page','settings' -PassThru -Wait
          if (-not (Test-Path app-settings.png)) { if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "Settings screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-inflection.png",'--shot-word','ABANDONS' -PassThru -Wait
          if (-not (Test-Path app-inflection.png)) { if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "Inflection screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-inflection-ar.png",'--shot-word','يكتبون' -PassThru -Wait
          if (-not (Test-Path app-inflection-ar.png)) { if (Test-Path "$env:APPDATA\SakhrDictionaryRevive\crash.log") { Get-Content "$env:APPDATA\SakhrDictionaryRevive\crash.log" }; Write-Error "Arabic inflection screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-enriched.png",'--shot-word','ACCRA' -PassThru -Wait
          if (-not (Test-Path app-enriched.png)) { Write-Error "Enriched screenshot missing"; exit 1 }
          '{"UseWiktionary":false}' | Set-Content "$env:APPDATA\SakhrDictionaryRevive\settings.json"
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-sakhr-only.png",'--shot-word','ABANDONS' -PassThru -Wait
          if (-not (Test-Path app-sakhr-only.png)) { Write-Error "Sakhr-only screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-sakhr-only-ar.png",'--shot-word','قط' -PassThru -Wait
          if (-not (Test-Path app-sakhr-only-ar.png)) { Write-Error "Sakhr-only Arabic screenshot missing"; exit 1 }
          $p = Start-Process publish\SakhrDictionaryRevive.exe -ArgumentList '--screenshot',"$PWD\app-sakhr-only-wik.png",'--shot-word','هاتان' -PassThru -Wait
          if (-not (Test-Path app-sakhr-only-wik.png)) { Write-Error "Sakhr-only Wiktionary-word screenshot missing"; exit 1 }
          Remove-Item "$env:APPDATA\SakhrDictionaryRevive\settings.json" -Force
          Write-Host "Screenshots captured"

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            publish
            app-light.png
            app-dark.png
            app-arabic.png
            app-settings.png
            app-inflection.png
            app-inflection-ar.png
            app-sakhr-only.png
            app-sakhr-only-ar.png
            app-home.png
            app-enriched.png
            app-sakhr-only-wik.png
            app-arabic-ui.png
            app-arabic-ui-cat.png
            app-settings-his.png
            app-settings-ar.png
            app-about.png
